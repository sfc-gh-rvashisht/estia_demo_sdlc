# Optional: run dbt on your own machine against your own DEV schemas.
# The normal workflow builds branches in Azure Pipelines (dbt-ci), so this
# is only needed for local experiments and for the dbt extension in VS Code.
estia_medallion:
  target: personal
  outputs:
    personal:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      authenticator: oauth_authorization_code   # Snowflake browser sign-in; no SAML needed
      client_store_temporary_credential: true   # cache the sign-in between commands
      database: ESTIA_DBT_DEMO_DEV
      schema: "{{ env_var('DBT_DEV_PREFIX') }}_SILVER"
      threads: 4
