# Values for env_var() when the project runs inside Snowflake.
# Role and warehouse come from the session or task that runs the project.
# DBT_DEV_PREFIX is replaced with the engineer's name when the DEV task graph
# builds their branch.
env_config:
  default_environment: default
  environments:
    - name: default
      env:
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_WAREHOUSE: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_DEV_PREFIX: NOT_SET
