# Values for env_var() when the project runs inside Snowflake.
# Role and warehouse come from the session that runs the project (the
# pipeline's service user). dbt-ci replaces DBT_DEV_PREFIX with the branch's
# name for each run.
env_config:
  default_environment: default
  environments:
    - name: default
      env:
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_WAREHOUSE: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_DEV_PREFIX: NOT_SET
