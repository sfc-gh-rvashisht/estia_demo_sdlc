# Used only when the project runs inside Snowflake (the PROD task graph).
# Local dbt reads profiles.yml instead. No credentials: the run uses the task
# owner's role and the task's warehouse.
estia_medallion:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      database: ESTIA_DBT_DEMO_PROD
      schema: SILVER
      threads: 8
