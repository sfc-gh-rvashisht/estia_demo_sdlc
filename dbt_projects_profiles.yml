# Used when the project runs inside Snowflake. No credentials: a run uses the
# role and warehouse of the pipeline's service user.
#
#   personal  a branch, in its own DEV schemas (<NAME>_SILVER/_GOLD).
#             dbt-ci passes the name in as DBT_DEV_PREFIX.
#   dev       shared DEV, built from main by dbt-release and dbt-refresh
#   prod      PROD, built from main by dbt-release and dbt-refresh
estia_medallion:
  target: prod
  outputs:
    personal:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      database: ESTIA_DBT_DEMO_DEV
      schema: "{{ env_var('DBT_DEV_PREFIX') }}_SILVER"
      threads: 8
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      database: ESTIA_DBT_DEMO_DEV
      schema: SILVER
      threads: 8
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: "{{ env_var('DBT_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      database: ESTIA_DBT_DEMO_PROD
      schema: SILVER
      threads: 8
